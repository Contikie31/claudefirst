name: Update deals and publish site

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - id: pages
        uses: actions/configure-pages@v5

      # History lives in the published site, so no data commits are needed.
      - name: Restore previously published deals
        run: |
          mkdir -p web/data
          curl -fsSL "${{ steps.pages.outputs.base_url }}/data/deals.json" -o web/data/deals.json \
            || echo "No previous data (first run)."

      - name: Fetch feeds
        env:
          SEC_USER_AGENT: "acquisitions-tracker ${{ github.repository }}"
        run: python -m acqtracker fetch

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
